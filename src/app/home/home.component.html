<div class="relative h-screen bg-cover bg-center mt-2" [ngStyle]="{'background-image': 'url(' + backgroundImage + ')'}">
    <!-- Color Overlay -->
    <div class="absolute inset-0" [ngStyle]="getOverlayStyle()"></div>

    <!-- Content -->
    <div class="relative flex flex-col items-center justify-center h-full text-white text-center">
        <h1 class="text-4xl font-bold mt-2">Shop With Us</h1>
        <p class="mt-4 max-w-xl">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam assumenda ea quo cupiditate facere
            deleniti fuga officia.
        </p>

        <!-- Buttons -->
        <div class="flex items-center mt-6 w-full max-w-lg justify-center">
            <button
                class="p-3 px-6 bg-custom-green text-white rounded-r-full font-medium hover:bg-custom-green-dark transition">
                SHOP NOW
            </button>
            <button
                class="p-3 px-6 bg-custom-green text-white rounded-r-full font-medium hover:bg-custom-green-dark transition ml-4">
                CLUB MEMBERSHIP
            </button>
        </div>
    </div>
</div>

<app-about-us></app-about-us>
<app-leaders></app-leaders>
<app-service></app-service>
