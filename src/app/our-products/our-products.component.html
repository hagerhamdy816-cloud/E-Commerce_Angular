<div class="container py-5 text-center">
    <div class="row mb-4 justify-content-center">
        <div class="col-md-4">
            <app-categories (categorySelected)="onCategorySelected($event)"></app-categories>
        </div>
        <div class="col-md-4">
            <select [(ngModel)]="sortOrder" (change)="filterProducts()" class="form-select">
                <option value="desc">Price: High to Low</option>
                <option value="asc">Price: Low to High</option>
            </select>
        </div>
    </div>
</div>

<div *ngIf="cartMessage" class="toast-message">
    {{ cartMessage }}
</div>

<div class="container py-5 text-center">
    <div class="row">
        <div class="col-md-4 col-sm-12" *ngFor="let product of products">
            <img [src]="product.image" alt="{{ product.title }}" class="w-100">
            <h2>{{ product.title }}</h2>
            <p>${{ product.price }}</p>
            <button class="btn btn-outline-info" (click)="getSingleData(product.id)">Product Details</button>
            <button class="btn btn-outline-success" (click)="addToCart(product)">
                <i class="fa-solid fa-cart-shopping"></i>
            </button>
            <button class="btn btn-outline-danger" (click)="removeFromCart(product.id)">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>
</div>
