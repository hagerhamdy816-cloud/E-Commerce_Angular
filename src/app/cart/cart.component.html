<div class="container py-5">
    <h2>Your Cart <i
        class="fa-solid fa-cart-shopping"></i></h2>
    <ul class="list-group">
        <li *ngFor="let product of cart" class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ product.title }} - ${{ product.price }} x {{ product.quantity }}</span>
            <button class="btn btn-danger btn-sm" (click)="removeFromCart(product.id)">Remove</button>
        </li>
    </ul>

    <button class="btn btn-warning mt-3" (click)="clearCart()">Clear Cart</button>
</div>
