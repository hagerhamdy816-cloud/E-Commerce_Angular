<footer class="footer bg-dark text-light py-5">
    <div class="container">
        <div class="row">
            <!-- Dynamic Sections -->
            <div class="col-lg-2 col-md-4 col-6 mb-4" *ngFor="let section of sections">
                <h5 class="text-white mb-3">{{ section.title }}</h5>
                <ul class="list-unstyled">
                    <li *ngFor="let link of section.links">
                        <a href="#" class="text-muted text-decoration-none">{{ link }}</a>
                    </li>
                </ul>
            </div>

            <!-- Newsletter Section -->
            <div class="col-lg-4 col-md-8 col-12">
                <h5 class="text-white mb-3">Newsletter</h5>
                <p class="text-muted">
                    You can trust us. We only send promo offers.
                </p>
                <form class="d-flex">
                    <input type="email" class="form-control me-2" placeholder="Your Email Address" />
                    <button class="btn btn-success" type="submit">Subscribe</button>
                </form>
            </div>
        </div>

        <!-- Footer Bottom -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <p class="mb-0 text-muted">
                Copyright ©{{ year }} All rights reserved 
            </p>
            <div class="social-icons">
                <a href="#" class="text-muted me-3"><i class="fab fa-facebook"></i></a>
                <a href="#" class="text-muted me-3"><i class="fab fa-twitter"></i></a>
                <a href="#" class="text-muted me-3"><i class="fab fa-dribbble"></i></a>
                <a href="#" class="text-muted"><i class="fab fa-behance"></i></a>
            </div>
        </div>
    </div>
</footer>
